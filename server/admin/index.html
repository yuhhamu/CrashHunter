<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CrashHunter Database 管理</title>
<style>
:root { --bg: #1e1f22; --panel: #2b2d31; --line: #3a3d43; --text: #e3e5e8; --muted: #9a9ea6; --accent: #589df6; --ok: #57c27a; --warn: #e0a83a; --bad: #e5595b; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", "Yu Gothic UI", system-ui, sans-serif; }
#app { display: flex; min-height: 100vh; }
nav { width: 170px; background: #18191c; padding: 14px 8px; display: flex; flex-direction: column; gap: 4px; }
nav .brand { font-weight: 700; padding: 0 10px 14px; }
nav button { text-align: left; background: none; border: 0; color: var(--text); padding: 8px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
nav button.on { background: var(--panel); color: var(--accent); }
nav .grow { flex: 1; }
main { flex: 1; padding: 18px 22px; overflow: auto; }
h1 { font-size: 18px; margin: 0 0 14px; }
h2 { font-size: 15px; margin: 18px 0 8px; }
.cards { display: flex; flex-wrap: wrap; gap: 10px; }
.card { background: var(--panel); border-radius: 8px; padding: 10px 14px; min-width: 120px; }
.card .n { font-size: 22px; font-weight: 700; }
.card .l { color: var(--muted); font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
input, select { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 8px; font: inherit; }
button.b { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
button.b:hover { border-color: var(--accent); }
button.p { background: var(--accent); border-color: var(--accent); color: #fff; }
button.d { border-color: var(--bad); color: var(--bad); }
table { border-collapse: collapse; width: 100%; background: var(--panel); border-radius: 8px; overflow: hidden; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #32353b; }
.muted { color: var(--muted); }
.mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; }
pre { background: #18191c; border-radius: 8px; padding: 10px; overflow: auto; max-height: 420px; font-size: 12px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.panel { background: var(--panel); border-radius: 8px; padding: 12px 14px; margin-top: 12px; }
.empty { color: var(--muted); padding: 10px 0; }
.err { color: var(--bad); }
.toast { position: fixed; right: 18px; bottom: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="admin/app.js"></script>
</body>
</html>
